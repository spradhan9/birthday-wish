<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎂 Happy Birthday 🎉</title>

<meta property="og:title" content="🎂 Happy Birthday 🎉">
<meta property="og:description" content="A special birthday surprise is waiting for you! 🎁">
<meta property="og:image" content="https://spradhan9.github.io/birthday-wish/cover.jpg">
<meta property="og:url" content="https://spradhan9.github.io/birthday-wish/">
<meta property="og:type" content="website">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff5f6d,#ffc371);
display:flex;
justify-content:center;
align-items:center;
color:#fff;
position:relative;
}

.container{
text-align:center;
z-index:10;
padding:20px;
}

.title{
font-size:3rem;
margin-bottom:20px;
text-shadow:0 0 20px rgba(255,255,255,.8);
animation:pulse 2s infinite;
}

@keyframes pulse{
50%{transform:scale(1.05);}
}

.cake-area{
position:relative;
width:260px;
margin:auto;
}

.candle{
width:14px;
height:60px;
background:#fff;
margin:auto;
border-radius:5px;
cursor:pointer;
position:relative;
}

.flame{
width:22px;
height:35px;
background:gold;
position:absolute;
left:50%;
top:-28px;
transform:translateX(-50%);
border-radius:50%;
box-shadow:0 0 25px orange;
animation:flicker .2s infinite alternate;
}

@keyframes flicker{
from{transform:translateX(-50%) scale(1);}
to{transform:translateX(-50%) scale(1.15);}
}

.smoke{
position:absolute;
width:20px;
height:20px;
background:rgba(255,255,255,.6);
border-radius:50%;
left:50%;
top:-15px;
transform:translateX(-50%);
display:none;
animation:smokeUp 2s forwards;
}

@keyframes smokeUp{
0%{opacity:1;}
100%{
opacity:0;
transform:translate(-50%,-80px) scale(2);
}
}

.cake{
width:260px;
height:140px;
background:#ff4d6d;
margin-top:10px;
border-radius:15px;
cursor:pointer;
position:relative;
box-shadow:0 10px 30px rgba(0,0,0,.3);
transition:1s;
}

.cake::before{
content:'';
position:absolute;
width:100%;
height:25px;
background:#fff;
top:25px;
left:0;
}

.cake::after{
content:'🎂';
position:absolute;
font-size:60px;
left:50%;
top:50%;
transform:translate(-50%,-50%);
}

.cut{
transform:rotate(-5deg) scale(.85);
opacity:.2;
}

.instruction{
margin-top:15px;
font-size:1.1rem;
}

.reveal{
display:none;
max-width:700px;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.photo{
width:260px;
height:260px;
border-radius:50%;
border:6px solid #fff;
object-fit:cover;
box-shadow:0 0 30px rgba(255,255,255,.8);
margin-bottom:20px;
}

.message{
font-size:1.3rem;
line-height:1.8;
background:rgba(255,255,255,.15);
padding:25px;
border-radius:20px;
backdrop-filter:blur(10px);
}

.balloon{
position:absolute;
bottom:-100px;
font-size:40px;
animation:floatUp linear infinite;
}

@keyframes floatUp{
to{
transform:translateY(-120vh);
}
}

.confetti{
position:absolute;
width:10px;
height:10px;
top:-10px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}

.firework{
position:absolute;
font-size:25px;
animation:boom 1s forwards;
}

@keyframes boom{
from{
opacity:1;
transform:scale(.3);
}
to{
opacity:0;
transform:scale(3);
}
}

@media(max-width:600px){
.title{
font-size:2rem;
}
.message{
font-size:1rem;
}
}
</style>
</head>
<body>

<div class="container">

<h1 class="title">🎉 Happy Birthday 🎉</h1>

<div id="stage1">

<div class="cake-area">

<div class="candle" id="candle">
<div class="flame" id="flame"></div>
<div class="smoke" id="smoke"></div>
</div>

<div class="cake" id="cake"></div>

</div>

<p class="instruction" id="instruction">
🕯️ Tap the candle to blow it out
</p>

</div>

<div class="reveal" id="reveal">

<img
class="photo"
src="birthday-photo.jpg"
alt="Birthday Photo">

<div class="message">
<h2>🎂 Happy Birthday 🎂</h2>
<br>
<p>
May your day be filled with happiness,
love, laughter, success and unforgettable memories.
May all your dreams come true and may this year
bring you endless joy and beautiful moments.
✨❤️🎉
</p>
</div>

</div>

</div>

<script>
let candleBlown=false;

const flame=document.getElementById("flame");
const smoke=document.getElementById("smoke");
const candle=document.getElementById("candle");
const cake=document.getElementById("cake");
const reveal=document.getElementById("reveal");
const instruction=document.getElementById("instruction");

createBalloons();

candle.addEventListener("click",()=>{

if(candleBlown) return;

candleBlown=true;

flame.style.display="none";

smoke.style.display="block";

instruction.innerHTML="🎂 Great! Now tap the cake to cut it";

});

cake.addEventListener("click",()=>{

if(!candleBlown){

alert("🕯️ Blow out the candle first!");
return;
}

cake.classList.add("cut");

setTimeout(()=>{

document.getElementById("stage1").style.display="none";

reveal.style.display="block";

createConfetti();

startFireworks();

},1200);

});

function createBalloons(){

for(let i=0;i<20;i++){

const b=document.createElement("div");

b.className="balloon";

b.innerHTML=["🎈","🎈","🎈"][Math.floor(Math.random()*3)];

b.style.left=Math.random()*100+"vw";

b.style.animationDuration=
(8+Math.random()*10)+"s";

document.body.appendChild(b);
}
}

function createConfetti(){

for(let i=0;i<200;i++){

const c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=
`hsl(${Math.random()*360},100%,50%)`;

c.style.animationDuration=
(2+Math.random()*3)+"s";

document.body.appendChild(c);

setTimeout(()=>c.remove(),5000);
}
}

function startFireworks(){

let count=0;

const interval=setInterval(()=>{

const f=document.createElement("div");

f.className="firework";

f.innerHTML="✨";

f.style.left=Math.random()*100+"vw";

f.style.top=Math.random()*70+"vh";

document.body.appendChild(f);

setTimeout(()=>f.remove(),1000);

count++;

if(count>50){
clearInterval(interval);
}

},150);

}
</script>

</body>
</html>
